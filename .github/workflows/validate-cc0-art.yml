name: Validate CC0 Art Bootstrap

on:
  pull_request:
    paths:
      - "Tools/Art/**"
      - "Tools/Blender/**"
      - "Tools/Dev/integrate_generated_hero.ps1"
      - "Tools/ArtPipeline/import_blender_hero.py"
      - "Content/Python/import_cc0_vertical_slice.py"
      - ".github/workflows/validate-cc0-art.yml"
  push:
    branches:
      - "agent/cc0-art-bootstrap"
    paths:
      - "Tools/Art/**"
      - "Tools/Blender/**"
      - "Tools/Dev/integrate_generated_hero.ps1"
      - "Tools/ArtPipeline/import_blender_hero.py"
      - "Content/Python/import_cc0_vertical_slice.py"
      - ".github/workflows/validate-cc0-art.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate manifest and importers
        run: |
          python Tools/Art/validate_cc0_bootstrap.py
          python -m py_compile Tools/Blender/generate_arash_hero.py
          python -m py_compile Tools/ArtPipeline/import_blender_hero.py

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $Failed = $false
          Get-ChildItem Tools -Filter *.ps1 -File -Recurse | ForEach-Object {
            $Tokens = $null
            $Errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$Tokens, [ref]$Errors) | Out-Null
            if ($Errors.Count -gt 0) {
              $Failed = $true
              Write-Error "PowerShell syntax errors in $($_.FullName): $($Errors | Out-String)"
            }
          }
          if ($Failed) { exit 1 }
